        // 从 GitHub 获取文章列表（并按日期排序）
        async function fetchPostsFromGitHub(type) {
            const baseUrl = `https://api.github.com/repos/circlexhy/circlexhy.github.io/contents/${type}/json`;

            try {
                const response = await fetch(baseUrl, {
                    headers: { 'Accept': 'application/vnd.github.v3+json' }
                });

                if (!response.ok) {
                    if (response.status === 404) {
                        return [];
                    }
                    throw new Error(`GitHub API 请求失败: ${response.status}`);
                }

                const files = await response.json();
                const posts = [];

                for (const file of files) {
                    if (file.name.endsWith('.json')) {
                        try {
                            const contentRes = await fetch(file.download_url);
                            const data = await contentRes.json();
                            if (data.posts && data.posts.length > 0) {
                                posts.push(data.posts[0]);
                            }
                        } catch (e) {
                            console.warn(`读取 ${file.name} 失败:`, e);
                        }
                    }
                }

                // ===== ✅ 核心排序逻辑：按日期最新的排在最前面 =====
                posts.sort((a, b) => {
                    // 优先使用 date 字段
                    if (a.date && b.date) {
                        const dateA = new Date(a.date);
                        const dateB = new Date(b.date);
                        // 如果日期有效，按日期降序排序（最新的在前）
                        if (!isNaN(dateA) && !isNaN(dateB)) {
                            return dateB - dateA;
                        }
                    }
                    // 降级方案：使用 slug 排序（假设 slug 包含日期或按创建顺序）
                    if (a.slug && b.slug) {
                        return b.slug.localeCompare(a.slug);
                    }
                    return 0;
                });

                return posts;
            } catch (error) {
                console.error('获取文章列表失败:', error);
                return [];
            }
        }

        // 渲染文章列表
        function renderPostList(posts, page, pageSize, type) {
            const totalPosts = posts.length;
            const totalPages = Math.ceil(totalPosts / pageSize) || 1;
            const start = (page - 1) * pageSize;
            const end = Math.min(start + pageSize, totalPosts);
            const pagePosts = posts.slice(start, end);

            const typeLabel = type === 'blogs' ? '博客' : '文章';

            // ✅ 只在文章页显示“新文章”按钮
            const showCreateBtn = type === 'articles';

            let html = `
    <section class="page-transition">
        <div class="flex items-start justify-between mb-2">
            <div>
                <h1 class="text-3xl font-sans font-light text-paper-text dark:text-ink-text tracking-wide">
                    ${type === 'blogs' ? 'Blogs / 博客' : 'Articles / 文章'}
                </h1>
                <br>
                <p class="text-paper-muted dark:text-ink-muted text-sm">
                    共 ${totalPosts} 篇${typeLabel}
                </p>
                <br>
            </div>
            ${showCreateBtn ? `
            <a href="send.html"
               class="flex items-center gap-1.5 px-4 py-2 bg-[#3fb950] text-[#0d1117] font-medium text-sm rounded-lg hover:bg-[#2ea043] transition shadow-sm flex-shrink-0 mt-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
                </svg>
                <span>新文章</span>
            </a>
            ` : ''}
        </div>
    `;

            if (pagePosts.length === 0) {
                html += `<p class="text-paper-muted dark:text-ink-muted">暂无文章</p>`;
            } else {
                html += `<div class="space-y-6">`;
                for (const post of pagePosts) {
                    const tagsHtml = post.tags && post.tags.length > 0
                        ? post.tags.map(t => `<span class="px-2 py-0.5 bg-paper-hover dark:bg-ink-hover rounded-full text-xs">${t}</span>`).join(' ')
                        : '';

                    html += `
                <article class="group border-b border-paper-border dark:border-ink-border pb-5 last:border-0">
                    <a href="/article-details.html?type=${type}&postname=${post.slug}"
                       class="block group-hover:text-[#3fb950] transition">
                        <h2 class="text-xl font-serif font-bold text-paper-text dark:text-ink-text group-hover:text-[#3fb950] transition">
                            ${post.title || '无标题'}
                        </h2>
                    </a>
                    <div class="flex flex-wrap items-center gap-3 text-xs text-paper-muted dark:text-ink-muted mt-2">
                    <div>
                        <span>${post.date || '未知日期'} @${post.writer || 'Unknown'}</span>
                    </div>
                        ${tagsHtml ? `<span>${tagsHtml}</span>` : ''}
                    </div>
                </article>
            `;
                }
                html += `</div>`;
            }

            // 分页导航
            if (totalPages > 1) {
                const prevDisabled = page <= 1 ? 'opacity-50 cursor-not-allowed pointer-events-none' : '';
                const nextDisabled = page >= totalPages ? 'opacity-50 cursor-not-allowed pointer-events-none' : '';

                html += `
            <div class="flex items-center justify-between mt-8 pt-4 border-t border-paper-border dark:border-ink-border">
                <button onclick="loadPostList('${type}', ${page - 1})"
                        class="px-4 py-2 text-sm rounded-lg border border-paper-border dark:border-ink-border hover:border-[#3fb950] transition ${prevDisabled}">
                    ← 上一页
                </button>
                <span class="text-sm text-paper-muted dark:text-ink-muted">
                    第 ${page} / ${totalPages} 页
                </span>
                <button onclick="loadPostList('${type}', ${page + 1})"
                        class="px-4 py-2 text-sm rounded-lg border border-paper-border dark:border-ink-border hover:border-[#3fb950] transition ${nextDisabled}">
                    下一页 →
                </button>
            </div>
        `;
            }

            html += `</section>`;
            return html;
        }

        // 加载文章列表（外部调用）
        async function loadPostList(type, page = 1) {
            // 如果缓存为空，从 GitHub 获取
            if (postsCache[type].length === 0) {
                const container = document.getElementById(`${type}-list`);
                if (container) {
                    container.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-20">
                        <div class="loading-spinner"></div>
                        <p class="text-paper-muted dark:text-ink-muted mt-4 text-sm">加载中...</p>
                    </div>
                `;
                }

                const posts = await fetchPostsFromGitHub(type);
                postsCache[type] = posts;
            }

            // 更新当前页码
            const totalPages = Math.ceil(postsCache[type].length / PAGE_SIZE) || 1;
            currentPage[type] = Math.max(1, Math.min(page, totalPages));

            // 渲染列表
            const container = document.getElementById(`${type}-list`);
            if (container) {
                container.innerHTML = renderPostList(
                    postsCache[type],
                    currentPage[type],
                    PAGE_SIZE,
                    type
                );
            }
        }

        // 全局暴露
        window.loadPostList = loadPostList;

        // ================================================================
        // 7. 导航核心函数
        // ================================================================

        function navigateTo(pageName) {
            const page = pages[pageName];
            if (!page) return;

            const app = document.getElementById('app');
            app.innerHTML = page.content;

            document.title = page.title;
            history.pushState({ page: pageName }, '', `#${pageName}`);

            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.toggle('active', link.dataset.page === pageName);
            });

            window.scrollTo({ top: 0, behavior: 'smooth' });

            // 首页加载评论
            if (pageName === 'home') {
                giscusLoaded = false;
                setTimeout(loadGiscus, 200);
            }

            // 关于页加载 GitHub 信息
            if (pageName === 'about') {
                setTimeout(loadGitHubProfile, 200);
            }

            // 博客/文章页加载列表
            if (pageName === 'blogs') {
                currentPage.blogs = 1;
                setTimeout(() => loadPostList('blogs', 1), 100);
            }
            if (pageName === 'articles') {
                currentPage.articles = 1;
                setTimeout(() => loadPostList('articles', 1), 100);
            }
        }

        // ================================================================
        // 8. 绑定事件
        // ================================================================

        document.addEventListener('DOMContentLoaded', () => {
            // 导航点击
            document.querySelectorAll('.nav-link').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const page = link.dataset.page;
                    if (page) navigateTo(page);
                });
            });

            // 浏览器前进/后退
            window.addEventListener('popstate', (e) => {
                const page = e.state?.page || 'home';
                const pageData = pages[page];
                if (pageData) {
                    document.getElementById('app').innerHTML = pageData.content;
                    document.title = pageData.title;
                    document.querySelectorAll('.nav-link').forEach(link => {
                        link.classList.toggle('active', link.dataset.page === page);
                    });

                    // 如果是博客/文章页，重新加载列表
                    if (page === 'blogs') {
                        currentPage.blogs = 1;
                        setTimeout(() => loadPostList('blogs', 1), 150);
                    }
                    if (page === 'articles') {
                        currentPage.articles = 1;
                        setTimeout(() => loadPostList('articles', 1), 150);
                    }
                }
            });

            // 初始化：从 URL hash 读取，默认首页
            const hash = window.location.hash.replace('#', '');
            const initialPage = pages[hash] ? hash : 'home';
            navigateTo(initialPage);
        });

        // 暴露到全局
        window.navigateTo = navigateTo;
    </script>

</body>
</html>
